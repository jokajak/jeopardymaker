<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeopardy Maker</title>
  <style>
    /* ── Reset + base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:       #060CE9;
      --gold:       #FFD700;
      --dark:       #060060;
      --light-blue: #1a1aff;
      --text-light: #fff;
      --text-dark:  #111;
      --revealed:   #333;
      --p1-color:   #e74c3c;
      --p2-color:   #2ecc71;
      --danger:     #c0392b;
      --radius:     6px;
    }

    body {
      font-family: 'Arial Black', Arial, sans-serif;
      background: var(--dark);
      color: var(--text-light);
      min-height: 100vh;
    }

    button { cursor: pointer; font-family: inherit; }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn {
      padding: 8px 16px;
      border: 2px solid var(--gold);
      background: transparent;
      color: var(--gold);
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: bold;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover { background: var(--gold); color: var(--dark); }
    .btn.primary { background: var(--gold); color: var(--dark); }
    .btn.primary:hover { background: #e6c200; border-color: #e6c200; }
    .btn.danger { border-color: var(--danger); color: var(--danger); }
    .btn.danger:hover { background: var(--danger); color: #fff; }
    .btn.small { padding: 4px 10px; font-size: 0.8rem; }

    /* ── Home screen ──────────────────────────────────────────────────────── */
    .home-root {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .home-header h1 {
      font-size: 2.5rem;
      color: var(--gold);
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px #000;
    }
    .home-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }
    .empty-state {
      color: #aaa;
      text-align: center;
      margin-top: 40px;
      font-size: 1rem;
    }
    .board-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .board-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,215,0,0.2);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .board-info { display: flex; flex-direction: column; gap: 4px; }
    .board-title { font-size: 1.1rem; font-weight: bold; color: var(--gold); }
    .board-meta { font-size: 0.8rem; color: #aaa; font-weight: normal; }
    .board-btns { display: flex; gap: 8px; }

    /* ── Play screen ──────────────────────────────────────────────────────── */
    .play-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 8px;
      gap: 8px;
    }
    .scorebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 16px;
      background: rgba(0,0,0,0.4);
      border-radius: var(--radius);
      flex-shrink: 0;
    }
    .score {
      font-size: 1.4rem;
      font-weight: bold;
      min-width: 120px;
    }
    .p1-score { color: var(--p1-color); text-align: left; }
    .p2-score { color: var(--p2-color); text-align: right; }
    .exit-btn {
      background: none;
      border: 1px solid #555;
      color: #aaa;
      padding: 4px 12px;
      border-radius: var(--radius);
      font-size: 0.85rem;
    }
    .exit-btn:hover { border-color: var(--gold); color: var(--gold); }

    .play-board {
      display: grid;
      flex: 1;
      gap: 6px;
      min-height: 0;
    }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      font-weight: bold;
      text-align: center;
      padding: 8px;
      overflow: hidden;
    }
    .header-cell {
      background: var(--blue);
      color: var(--text-light);
      font-size: clamp(0.7rem, 1.5vw, 1.1rem);
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 2px solid var(--light-blue);
      min-height: 60px;
    }
    .value-cell {
      background: var(--blue);
      color: var(--gold);
      font-size: clamp(1rem, 2.5vw, 2rem);
      cursor: pointer;
      border: 2px solid var(--light-blue);
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }
    .value-cell:hover:not(.revealed) { background: var(--light-blue); transform: scale(1.02); }
    .value-cell.revealed {
      background: var(--revealed);
      color: #555;
      cursor: default;
      border-color: #444;
    }

    /* ── Modal overlay ────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-content {
      background: var(--blue);
      border: 4px solid var(--gold);
      border-radius: 12px;
      padding: 40px;
      max-width: 700px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-value {
      color: var(--gold);
      font-size: 1.8rem;
      font-weight: bold;
    }
    .modal-text {
      font-size: clamp(1.2rem, 3vw, 2rem);
      line-height: 1.4;
      color: var(--text-light);
    }
    .modal-image {
      max-width: 100%;
      max-height: 50vh;
      border-radius: 8px;
      object-fit: contain;
    }
    .modal-hint {
      font-size: 0.8rem;
      color: #aaa;
      font-weight: normal;
      margin-top: 8px;
    }

    /* ── App container ────────────────────────────────────────────────────── */
    #app { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mountHome } from './src/home.js';
    import { mountPlay } from './src/play.js';

    const app = document.getElementById('app');

    function showHome() {
      mountHome(app, (board, state) => showPlay(board, state));
    }

    function showPlay(board, state) {
      mountPlay(app, board, state, showHome);
    }

    showHome();
  </script>
</body>
</html>
